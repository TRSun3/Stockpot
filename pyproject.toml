[project]
name = "stockpot"
version = "0.1.0"
description = "A virtual kitchen that knows what you have and what to cook with it"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
# Playwright drives the installed Edge for the browser checks; the app never imports it.
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3.17:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
